<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card/Pill Drop Shadows & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <radialGradient id="meshCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlow" cx="10%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.15); opacity: 0.35; }
    }
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1.5deg); }
    }
    @keyframes floatSlow3 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1deg); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmerBar {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .bg-grid {
      stroke: #334155;
      stroke-opacity: 0.12;
      stroke-width: 1;
    }
    .flow-line {
      stroke: url(#primaryGlow);
      stroke-width: 1.5;
      stroke-dasharray: 8 12;
      animation: beamFlow 20s linear infinite;
      opacity: 0.45;
    }
    .ambient-center {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: center;
    }
    .float-item-1 {
      animation: floatSlow1 6s ease-in-out infinite;
    }
    .float-item-2 {
      animation: floatSlow2 7.5s ease-in-out infinite;
    }
    .float-item-3 {
      animation: floatSlow3 8.5s ease-in-out infinite;
    }
    .accent-bar {
      animation: shimmerBar 3s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .mono-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="600" cy="190" r="280" fill="url(#meshCenter)" class="ambient-center" />
  <circle cx="100" cy="80" r="200" fill="url(#cornerGlow)" />

  <!-- Tech Geometric Grid Background Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Dynamic Connecting Network Curves -->
  <path d="M 50 80 Q 300 20 600 80 T 1150 70" fill="none" class="flow-line" />
  <path d="M 50 310 Q 350 370 600 310 T 1150 320" fill="none" class="flow-line" style="animation-duration: 25s; animation-direction: reverse;" />

  <!-- Outer Glowing Border -->
  <rect x="2" y="2" width="1196" height="376" rx="14" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.4" />

  <!-- Dynamic Background Badges / Floating Framework Pills (Positions carefully tuned to never obstruct center title) -->
  
  <!-- Left Side Badges -->
  <g class="float-item-1" transform="translate(60, 95)" filter="url(#softShadow)">
    <rect width="130" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" fill="#e2e8f0" class="mono-pill">⚡ Next.js</text>
  </g>

  <g class="float-item-2" transform="translate(45, 170)" filter="url(#softShadow)">
    <rect width="120" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#ff5d01" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#ff5d01" />
    <text x="32" y="22" fill="#e2e8f0" class="mono-pill">🚀 Astro</text>
  </g>

  <g class="float-item-3" transform="translate(70, 245)" filter="url(#softShadow)">
    <rect width="125" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#00dc82" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#00dc82" />
    <text x="32" y="22" fill="#e2e8f0" class="mono-pill">🟢 Nuxt</text>
  </g>

  <!-- Right Side Badges -->
  <g class="float-item-2" transform="translate(1005, 95)" filter="url(#softShadow)">
    <rect width="135" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#ff3e00" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#ff3e00" />
    <text x="32" y="22" fill="#e2e8f0" class="mono-pill">🔥 SvelteKit</text>
  </g>

  <g class="float-item-1" transform="translate(1025, 170)" filter="url(#softShadow)">
    <rect width="125" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#e11d48" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#e11d48" />
    <text x="32" y="22" fill="#e2e8f0" class="mono-pill">💎 Remix</text>
  </g>

  <g class="float-item-3" transform="translate(995, 245)" filter="url(#softShadow)">
    <rect width="140" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#0ea5e9" />
    <text x="32" y="22" fill="#e2e8f0" class="mono-pill">⚡ Fastify/Hono</text>
  </g>

  <!-- Top Center Category Pill -->
  <g transform="translate(460, 42)" filter="url(#softShadow)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <text x="140" y="21" fill="#a5b4fc" class="mono-pill" text-anchor="middle" font-size="12">✨ THE MODERN WEB STACK</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Ensured 100% unobstructed, crystal clear contrast) -->

  <!-- Top Decorative Accent Shimmer Bar -->
  <rect x="520" y="98" width="160" height="4" rx="2" fill="url(#primaryGlow)" class="accent-bar" />

  <!-- Main Hero Title -->
  <text x="600" y="165" text-anchor="middle" class="title-text" fill="#ffffff" font-size="52" filter="url(#softShadow)">
    Awesome Web Frameworks
  </text>

  <!-- Gradient Title Highlights / Sub-heading -->
  <text x="600" y="212" text-anchor="middle" class="title-text" fill="url(#primaryGlow)" font-size="22" font-weight="700" letter-spacing="1.5">
    CURATED ECOSYSTEM FOR MODERN FULL-STACK &amp; EDGE WEB APPS
  </text>

  <!-- Descriptive Subtitle -->
  <text x="600" y="250" text-anchor="middle" class="sub-text" fill="#94a3b8" font-size="15">
    Meta-Frameworks • Static Site Generators • SSR &amp; Islands Architecture • Composable Cloud &amp; Edge Hosts
  </text>

  <!-- Bottom Interactive Tag Badges -->
  <g transform="translate(330, 285)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="125" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="62" y="18" fill="#38bdf8" class="mono-pill" text-anchor="middle" font-size="11.5">🌟 Open Source</text>

    <!-- Tag 2 -->
    <rect x="137" y="0" width="125" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="200" y="18" fill="#818cf8" class="mono-pill" text-anchor="middle" font-size="11.5">⚡ Edge Ready</text>

    <!-- Tag 3 -->
    <rect x="274" y="0" width="125" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="337" y="18" fill="#c084fc" class="mono-pill" text-anchor="middle" font-size="11.5">🚀 Modern DX</text>

    <!-- Tag 4 -->
    <rect x="411" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="476" y="18" fill="#f43f5e" class="mono-pill" text-anchor="middle" font-size="11.5">📊 Verified 2026</text>
  </g>
</svg>
